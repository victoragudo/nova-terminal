name: Bug report
description: Something in Nova does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The more precise the steps, the faster it gets fixed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new tab with Cmd+T
        2. Split it with Cmd+D
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nova version
      description: Nova > About Nova.
      placeholder: v1.20.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.1, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: zsh, fish, bash...
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs or anything else
      description: Drag images or crash logs here. Remove any tokens or private paths first.
