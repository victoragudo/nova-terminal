name: Feature request
description: An idea that would make Nova better for you.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow behind the idea, in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Nova to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Other terminals, tools or workarounds you use for this.
